<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharatSewa AI - Built for Bharat Hackathon 2.0</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone for direct browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-orange-50 text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const SCHEMES = [
      {
        id: 1,
        title: 'PM-KISAN Samman Nidhi',
        category: 'Agriculture',
        benefit: '₹6,000 per year income support',
        eligibility: 'Small and marginal farmers'
      },
      {
        id: 2,
        title: 'Ayushman Bharat (PM-JAY)',
        category: 'Healthcare',
        benefit: '₹5 Lakh free health cover per family/year',
        eligibility: 'Low-income families'
      },
      {
        id: 3,
        title: 'PM Mudra Yojana',
        category: 'Business & Microfinance',
        benefit: 'Loans up to ₹10 Lakh without collateral',
        eligibility: 'Micro-enterprises & small business owners'
      },
      {
        id: 4,
        title: 'PM Awas Yojana (PMAY)',
        category: 'Housing',
        benefit: 'Interest subsidy on home loans',
        eligibility: 'Economically Weaker Section (EWS) & LIG'
      }
    ];

    function App() {
      const [language, setLanguage] = useState('hi-IN');
      const [isListening, setIsListening] = useState(false);
      const [transcript, setTranscript] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filteredSchemes, setFilteredSchemes] = useState(SCHEMES);

      const startSpeechRecognition = () => {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
          alert('Speech recognition is not supported in this browser. Please use Google Chrome.');
          return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = language;
        recognition.interimResults = false;

        recognition.onstart = () => setIsListening(true);
        recognition.onend = () => setIsListening(false);

        recognition.onresult = (event) => {
          const text = event.results[0][0].transcript;
          setTranscript(text);
          setSearchQuery(text);
          filterSchemes(text);
        };

        recognition.start();
      };

      const filterSchemes = (query) => {
        if (!query) {
          setFilteredSchemes(SCHEMES);
          return;
        }
        const q = query.toLowerCase();
        const result = SCHEMES.filter(
          (s) =>
            s.title.toLowerCase().includes(q) ||
            s.category.toLowerCase().includes(q) ||
            s.eligibility.toLowerCase().includes(q)
        );
        setFilteredSchemes(result);
      };

      return (
        <div className="min-h-screen p-4">
          {/* Header */}
          <header className="max-w-3xl mx-auto flex justify-between items-center bg-white p-4 rounded-xl shadow-md border-b-4 border-orange-500">
            <div>
              <h1 className="text-2xl font-bold text-orange-600">BharatSewa AI</h1>
              <p className="text-xs text-gray-500">Built for Bharat Hackathon 2.0</p>
            </div>
            <select
              value={language}
              onChange={(e) => setLanguage(e.target.value)}
              className="p-2 border rounded-lg text-sm bg-gray-50 focus:outline-none border-orange-300"
            >
              <option value="hi-IN">हिंदी (Hindi)</option>
              <option value="ta-IN">தமிழ் (Tamil)</option>
              <option value="te-IN">తెలుగు (Telugu)</option>
              <option value="mr-IN">मराठी (Marathi)</option>
              <option value="en-IN">English (India)</option>
            </select>
          </header>

          {/* Main Content */}
          <main className="max-w-3xl mx-auto mt-6">
            {/* Voice & Search Card */}
            <div className="bg-white p-6 rounded-xl shadow-md text-center border border-orange-100 mb-6">
              <h2 className="text-lg font-semibold mb-2">Speak or Search Your Need</h2>
              <p className="text-sm text-gray-500 mb-4">
                Tap the mic and speak in your local language (e.g., "Kisan loan", "Health cover")
              </p>

              <button
                onClick={startSpeechRecognition}
                className={`px-6 py-4 rounded-full font-bold text-white transition-all shadow-lg flex items-center justify-center gap-2 mx-auto ${
                  isListening ? 'bg-red-500 animate-pulse' : 'bg-orange-500 hover:bg-orange-600'
                }`}
              >
                <span className="text-xl">🎤</span>
                {isListening ? 'Listening...' : 'Tap to Speak'}
              </button>

              {transcript && (
                <div className="mt-4 p-3 bg-orange-50 rounded-lg border border-orange-200">
                  <span className="text-xs font-bold text-orange-600 uppercase">You said:</span>
                  <p className="text-base font-medium text-gray-700">"{transcript}"</p>
                </div>
              )}

              <div className="mt-4">
                <input
                  type="text"
                  placeholder="Or type to search schemes..."
                  value={searchQuery}
                  onChange={(e) => {
                    setSearchQuery(e.target.value);
                    filterSchemes(e.target.value);
                  }}
                  className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-400 focus:outline-none"
                />
              </div>
            </div>

            {/* Scheme List */}
            <section>
              <h3 className="text-md font-bold text-gray-700 mb-3">
                Available Schemes ({filteredSchemes.length})
              </h3>
              <div className="grid gap-4">
                {filteredSchemes.map((scheme) => (
                  <div
                    key={scheme.id}
                    className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition"
                  >
                    <div className="flex justify-between items-start mb-2">
                      <h4 className="font-bold text-lg text-gray-800">{scheme.title}</h4>
                      <span className="bg-orange-100 text-orange-700 text-xs px-2.5 py-1 rounded-full font-semibold">
                        {scheme.category}
                      </span>
                    </div>
                    <p className="text-sm text-gray-600 mb-1">
                      <strong>Benefit:</strong> {scheme.benefit}
                    </p>
                    <p className="text-sm text-gray-600 mb-3">
                      <strong>Eligibility:</strong> {scheme.eligibility}
                    </p>
                    <button
                      onClick={() => alert(`Applied for ${scheme.title} successfully!`)}
                      className="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 transition"
                    >
                      Apply Now (One-Click)
                    </button>
                  </div>
                ))}
              </div>
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
